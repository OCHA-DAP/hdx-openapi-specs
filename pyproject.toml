[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ckan-datastore-openapi"
version = "0.1.0"
description = "OpenAPI 3.1 specification generator for the CKAN DataStore API"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["models*"]

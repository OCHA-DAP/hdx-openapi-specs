name: Generate OpenAPI Spec

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Safe default — each job declares only the permissions it actually needs.
permissions:
  contents: read

jobs:
  # Runs on every trigger, including PRs — the only job that does.
  generate:
    name: Generate openapi.json
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e . openapi-spec-validator

      # Rebuilds dist/openapi.json from the Pydantic models in models/
      - name: Generate spec
        run: python generate.py

      - name: Validate OpenAPI spec
        run: python -m openapi_spec_validator dist/openapi.json

      # Hands the validated spec to the publish job so it publishes exactly
      # this file rather than regenerating it. main only — PRs skip this.
      - name: Upload validated spec
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: dist/openapi.json

  # Only runs on main, and only after generate succeeds — PRs never publish
  publish:
    name: Publish spec
    needs: generate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write  # needed to auto-commit the regenerated spec
    steps:
      - uses: actions/checkout@v4

      # Overwrites the checked-out dist/openapi.json with the validated one;
      # dist/index.html comes from the checkout.
      - name: Download validated spec
        uses: actions/download-artifact@v4
        with:
          name: openapi-spec
          path: dist/

      # Pushes the validated spec to GitBook.
      # Requires the GITBOOK_TOKEN and GITBOOK_ORG_ID secrets in repo settings.
      - name: Publish OpenAPI spec to GitBook
        env:
          GITBOOK_TOKEN: ${{ secrets.GITBOOK_TOKEN }}
          GITBOOK_ORG_ID: ${{ secrets.GITBOOK_ORG_ID }}
        run: |
          if [ -z "$GITBOOK_ORG_ID" ]; then
            echo "::error::GITBOOK_ORG_ID secret is empty — spec not published."
            exit 1
          fi
          npx -y @gitbook/cli@latest openapi publish \
            --spec hdx-tde \
            --organization "$GITBOOK_ORG_ID" \
            dist/openapi.json

      # Only commits if dist/openapi.json changed — no-op on clean runs
      - name: Commit updated spec
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: regenerate openapi.json"
          file_pattern: dist/openapi.json

      # Packages dist/ for the deploy job — includes openapi.json and index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # Only runs on main — PRs generate and validate but do not deploy
  deploy:
    name: Deploy to GitHub Pages
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write      # publish to GitHub Pages
      id-token: write   # authenticate via OIDC (required by deploy-pages)
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
